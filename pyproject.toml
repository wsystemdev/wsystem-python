[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wsystem"
version = "0.1.0"
description = "Python client for the W System API: EU VAT (VIES) and EORI validation, company registers, sanctions screening, KYB and EU e-invoicing (EN 16931, XRechnung, ZUGFeRD / Factur-X, Peppol). No dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "W System", email = "hello@wsystem.dev" }]
keywords = ["vies", "vat", "eori", "peppol", "xrechnung", "zugferd", "factur-x", "en16931", "e-invoicing", "kyb", "sanctions"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Typing :: Typed"]
dependencies = []

[project.urls]
Homepage = "https://wsystem.dev"
Documentation = "https://api.wsystem.dev/docs"
Source = "https://github.com/wsystemdev/wsystem-python"

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/wsystem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
